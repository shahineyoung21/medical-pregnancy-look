name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      # إذا كانت ملفات الأندرويد داخل مجلد فرعي (مثلاً MyBrotherMedicalAndroid)، 
      # قم بإزالة علامة # من السطر التالي واكتب اسم المجلد:
      # working-directory: ./اسم_المجلد

    - name: Build with Gradle
      run: ./gradlew assembleDebug
      # working-directory: ./اسم_المجلد

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        # path: ./اسم_المجلد/app/build/outputs/apk/debug/app-debug.apk
